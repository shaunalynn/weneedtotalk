<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Need to Talk</title>
  <meta name="description" content="Hand-lettered notes to the people, places, and things that needed to hear it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F6F3EE;
      --ink: #1C1917;
      --ink-muted: #78716C;
      --ink-faint: #C4BFB8;
      --accent: #D4522A;
      --white: #FDFCFB;
    }

    html { background: var(--cream); }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:  2rem 2.5rem;
      background: var(--white);
      border-bottom: 1px solid var(--ink-faint);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--ink);
      transition: all 0.25s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .logo-wrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .logo-note {
      background: var(--white);
      border: 1.5px solid var(--ink-faint);
      border-radius: 3px;
      padding: 8px 22px 8px 16px;
      position: relative;
      box-shadow: 2px 3px 0 var(--ink-faint);
      transform: rotate(-1.2deg);
      display: inline-block;
    }
    .logo-tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 13px;
      background: rgba(120, 200, 190, 0.5);
      border-radius: 2px;
    }
    .logo-text {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: var(--ink);
      white-space: nowrap;
    }

    .header-search {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
    }
    .header-search:hover { color: var(--ink); }

    /* ── Nav Drawer ── */
    nav.drawer {
      position: fixed;
      top: 0; left: 0;
      width: 260px;
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--ink-faint);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      z-index: 200;
      padding: 5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    nav.drawer.open { transform: translateX(0); }

    .drawer-close {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--ink-muted);
    }

    nav.drawer a {
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 0.6rem 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    nav.drawer a:hover {
      color: var(--ink);
      border-bottom-color: var(--ink-faint);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28,25,23,0.35);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.visible { opacity: 1; pointer-events: all; }

    /* ── Filter bar ── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 1.5rem 2.5rem 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-right: 4px;
    }
    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border: 1px solid var(--ink-faint);
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      color: var(--ink-muted);
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--ink);
      color: var(--cream);
      border-color: var(--ink);
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2rem 1.5rem;
      padding: 1rem 2.5rem 4rem;
    }

    .card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card[data-hidden="true"] { display: none; }

    .card-img-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: var(--white);
      border: 1px solid var(--ink-faint);
      aspect-ratio: 3/4;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .card:hover .card-img-wrap img { transform: scale(1.02); }

    .card-meta { padding: 10px 2px 0; }
    .card-title {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 500;
    }
    .card-cat {
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(28,25,23,0.92);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 520px;
      width: 100%;
      background: var(--white);
      border-radius: 4px;
      overflow: hidden;
      animation: lb-in 0.2s ease;
    }
    @keyframes lb-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lightbox-img {
      width: 100%;
      display: block;
    }

    .lightbox-footer {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--ink-faint);
    }
    .lightbox-title {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .download-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 18px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .download-btn:hover { background: var(--accent); }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(28,25,23,0.6);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: var(--ink); }

    /* ── Empty state ── */
    .empty-state {
      display: none;
      text-align: center;
      padding: 5rem 2rem;
      color: var(--ink-muted);
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      grid-column: 1 / -1;
    }
    .empty-state.visible { display: block; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--ink-faint);
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ── Search overlay ── */
    .search-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(246,243,238,0.97);
      align-items: flex-start;
      justify-content: center;
      padding-top: 6rem;
    }
    .search-overlay.open { display: flex; }
    .search-box {
      width: 100%;
      max-width: 480px;
      padding: 0 2rem;
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 8px;
      gap: 10px;
    }
    .search-input {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      background: none;
      border: none;
      color: var(--ink);
      flex: 1;
      outline: none;
    }
    .search-input::placeholder { color: var(--ink-faint); }
    .search-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--ink-muted);
      position: absolute;
      top: 1.5rem;
      right: 2rem;
    }
    .search-results {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .search-result-item {
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 8px 0;
      border-bottom: 1px solid var(--ink-faint);
      cursor: pointer;
      transition: color 0.15s;
    }
    .search-result-item:hover { color: var(--ink); }

    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      .grid { padding: 1rem 1.25rem 3rem; gap: 1.25rem; }
      .filters { padding: 1rem 1.25rem 0.5rem; }
      footer { padding: 1.5rem 1.25rem; flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Nav overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Drawer nav -->
  <nav class="drawer" id="drawer" role="navigation" aria-label="Main navigation">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">✕</button>
    <a href="index.html">Home</a>
    <a href="index.html?cat=neighbors">Neighbors</a>
    <a href="index.html?cat=roommates">Roommates</a>
    <a href="index.html?cat=co-workers">Co-workers</a>
    <a href="index.html?cat=parents">Parents</a>
    <a href="index.html?cat=drivers">Drivers</a>
    <a href="index.html?cat=miscellaneous">Miscellaneous</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <button class="hamburger" id="hamburger" aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-wrap">
      <a href="index.html" style="text-decoration:none;">
        <img src="logo.png" alt="We Need to Talk" style="height: 150px;">
      </a>
    </div>
    <button class="header-search" id="searchBtn" aria-label="Search">&#9906;</button>
  </header>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" role="search">
    <button class="search-close" id="searchClose" aria-label="Close search">✕</button>
    <div class="search-box">
      <div class="search-input-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="Search notes…" autocomplete="off">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="filters" role="group" aria-label="Filter by category">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="neighbors">Neighbors</button>
    <button class="filter-btn" data-cat="roommates">Roommates</button>
    <button class="filter-btn" data-cat="co-workers">Co-workers</button>
    <button class="filter-btn" data-cat="parents">Parents</button>
    <button class="filter-btn" data-cat="drivers">Drivers</button>
    <button class="filter-btn" data-cat="miscellaneous">Miscellaneous</button>
  </div>

  <!-- Grid -->
  <main>
    <div class="grid" id="grid">
      <!-- Cards are injected by JS from notes-data.js -->
      <div class="empty-state" id="emptyState">No notes found.</div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Note viewer">
    <div class="lightbox-inner">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
      <div class="lightbox-footer">
        <span class="lightbox-title" id="lightboxTitle"></span>
        <a class="download-btn" id="downloadBtn" href="#" download>
          ↓ Download
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <span>We Need to Talk</span>
    <span>Hand-lettered notes for the people who needed to hear it.</span>
  </footer>

  <script src="notes-data.js"></script>
  <script>
    // ── Render cards ──
    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('emptyState');

    function renderCards(notes) {
      const existing = grid.querySelectorAll('.card');
      existing.forEach(c => c.remove());

      notes.forEach(note => {
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.cats = note.categories.join(',').toLowerCase();
        card.dataset.title = note.title.toLowerCase();
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${note.image}" alt="${note.title}" loading="lazy">
          </div>
          <div class="card-meta">
            <div class="card-title">${note.title}</div>
            <div class="card-cat">${note.categories.join(', ')}</div>
          </div>
        `;
        card.addEventListener('click', () => openLightbox(note));
        grid.insertBefore(card, emptyState);
      });
    }

    renderCards(NOTES);

    // ── Filter ──
    let activeFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
      });
    });

    function applyFilter() {
      const cards = grid.querySelectorAll('.card');
      let visible = 0;
      cards.forEach(card => {
        const show = activeFilter === 'all' || card.dataset.cats.split(',').includes(activeFilter);
        card.dataset.hidden = show ? 'false' : 'true';
        if (show) visible++;
      });
      emptyState.classList.toggle('visible', visible === 0);
    }

    // ── Lightbox ──
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const downloadBtn = document.getElementById('downloadBtn');

    function openLightbox(note) {
      lightboxImg.src = note.image;
      lightboxImg.alt = note.title;
      lightboxTitle.textContent = note.title;
      downloadBtn.href = note.image;
      downloadBtn.download = note.title.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.jpg';
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeSearch(); closeDrawer(); } });

    // ── Nav drawer ──
    const hamburger = document.getElementById('hamburger');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');

    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('visible');
      hamburger.classList.add('open');
      hamburger.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('visible');
      hamburger.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
    hamburger.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    // ── Search ──
    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    document.getElementById('searchBtn').addEventListener('click', () => {
      searchOverlay.classList.add('open');
      setTimeout(() => searchInput.focus(), 50);
    });
    function closeSearch() { searchOverlay.classList.remove('open'); searchInput.value = ''; searchResults.innerHTML = ''; }
    document.getElementById('searchClose').addEventListener('click', closeSearch);

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      searchResults.innerHTML = '';
      if (!q) return;
      const matches = NOTES.filter(n => n.title.toLowerCase().includes(q) || n.categories.some(c => c.toLowerCase().includes(q)));
      matches.forEach(note => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.textContent = note.title;
        item.addEventListener('click', () => { closeSearch(); openLightbox(note); });
        searchResults.appendChild(item);
      });
      if (!matches.length) {
        searchResults.innerHTML = '<div class="search-result-item" style="cursor:default;">No results.</div>';
      }
    });

    // ── URL param filter ──
    const params = new URLSearchParams(window.location.search);
    const catParam = params.get('cat');
    if (catParam) {
      const btn = document.querySelector(`.filter-btn[data-cat="${catParam}"]`);
      if (btn) btn.click();
    }
  </script>
</body>
</html>
